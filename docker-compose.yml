version: "3.9"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://launchpad:launchpad@db:5432/launchpad_os"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad
      POSTGRES_DB: launchpad_os
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
